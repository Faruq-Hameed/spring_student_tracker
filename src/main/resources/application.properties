spring.application.name=cruddemo
spring.datasource.url=jdbc:mysql://localhost:3306/student_tracker
spring.datasource.username=springstudent
spring.datasource.password=springstudent
#
##Turn off the spring boot banner
spring.main.banner-mode=off
#
##Reduce logging level. Set logging to warn
logging.level.root=warn


#Add logging config to display SQL statements
#log sql statements
logging.level.org.hibernate.SQL=debug
#log values for sql statements
logging.level.org.hibernate.orm.jdbc.bind=trace

#Creating db tables automatically (NOT RECOMMENDED FOR PRODUCTION)
# =create drop all tables
#none = nothing will be performed
# create-drop= drop the db after closing the app
#validate = validate the db tables schema
#update= update the db tables schema
spring.jpa.hibernate.ddl-auto=update
